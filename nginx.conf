# Reverse proxy in front of the portal. For production TLS, add a `listen 443 ssl;`
# server block with your certificate and redirect 80 -> 443; this default serves
# plain HTTP on port 80 so the stack works out of the box.
upstream portal_backend {
    server portal:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;          # app caps request bodies at ~5MB; leave headroom

    # health check, kept out of the access log
    location = /api/health {
        proxy_pass http://portal_backend;
        access_log off;
    }

    location / {
        proxy_pass http://portal_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
