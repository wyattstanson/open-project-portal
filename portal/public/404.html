<style>
  :root{--bg:#faf9f8;--surface:#fff;--ink:#201f1e;--ink-2:#605e5c;--ink-3:#8a8886;--line:#edebe9;--brand:#0078d4;--brand-2:#106ebe;}
  @media(prefers-color-scheme:dark){:root{--bg:#1b1a19;--surface:#252423;--ink:#f3f2f1;--ink-2:#c8c6c4;--ink-3:#979593;--line:#3b3a39;--brand:#4aa5ec;--brand-2:#2b88d8;}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow-x:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",-apple-system,system-ui,Roboto,Arial,sans-serif;
    display:grid;place-items:center;padding:24px;text-align:center;}
  .wrap{max-width:440px;}
  .mark{width:56px;height:56px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;
    font-weight:700;font-size:26px;margin:0 auto 22px;}
  .code{font-size:74px;font-weight:700;letter-spacing:-.03em;line-height:1;background:linear-gradient(135deg,var(--brand),#ff8f63);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  h1{font-size:22px;font-weight:600;margin:14px 0 8px;}
  p{color:var(--ink-2);font-size:14.5px;line-height:1.55;margin:0 0 24px;}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;text-decoration:none;
    font-size:14px;font-weight:600;padding:10px 20px;border-radius:4px;box-shadow:0 6px 16px -8px var(--brand);transition:background .15s,transform .15s;}
  .btn:hover{background:var(--brand-2);transform:translateY(-1px);}
  .foot{margin-top:26px;font-size:12.5px;color:var(--ink-3);}
  .foot a{color:var(--ink-2);}
</style>
</head>
