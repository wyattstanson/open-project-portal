# Render Blueprint. In the Render dashboard: New -> Blueprint, point it at this
# repo, and it reads this file. The encryption key is baked into the repo
# (portal/data/.vault_key) so the deploy works with ZERO manual env config.
# This is a demo convenience with synthetic data in a PRIVATE repo; with real
# data you would instead set VAULT_KEY as a dashboard secret and not commit it.
services:
  - type: web
    name: open-project-portal
    runtime: node
    plan: free
    region: singapore          # closest to India; change if you prefer
    buildCommand: npm install   # no dependencies, effectively a no-op
    startCommand: node --experimental-sqlite portal/supervise.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: UV_THREADPOOL_SIZE
        value: "64"
      - key: NODE_OPTIONS          # enables node:sqlite regardless of start command
        value: "--experimental-sqlite"

# Free plan: the disk is ephemeral, so data/db.json resets to the committed
# 10,000-student database whenever the service restarts. The committed .vault_key
# keeps email encryption consistent, so it always comes back to a clean state.
# For durable data, upgrade the instance and attach a Disk at portal/data.
