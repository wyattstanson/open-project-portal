# Full stack: nginx (reverse proxy) -> portal (Node) -> Postgres (durable store).
#
#   docker compose up -d --build
#   open http://localhost        # nginx on :80, in front of the portal
#
# The portal uses Postgres because DATABASE_URL is set below. Without it, the same
# image falls back to the built-in SQLite store (single file, zero DB server).
#
# SCALE NOTE: run ONE portal instance. The app keeps the working set in memory and
# writes through to the store, so multiple instances would serve stale/conflicting
# state even with a shared Postgres. Multi-instance needs the in-memory cache dropped
# or invalidated first (see portal/store-pg.js and HISTORY.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  portal:
    build: .
    environment:
      - PORT=4000
      - NODE_ENV=production
      - UV_THREADPOOL_SIZE=64                                  # parallel password hashing
      - DATABASE_URL=postgres://portal:portal@db:5432/portal   # remove to use SQLite instead
      # - VAULT_KEY=<64-hex>                                    # set for real data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portal
    restart: unless-stopped

volumes:
  pgdata:
