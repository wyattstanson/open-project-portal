# Full stack: nginx (reverse proxy) -> portal (Node) -> Postgres (durable store).
#
#   cp .env.example .env      # then edit .env
#   docker compose up -d --build
#   open http://localhost     # nginx on :80, in front of the portal
#
# Every setting comes from .env (compose reads it automatically); the defaults after
# ":-" are used when a key is absent, so it also runs with no .env at all.
#
# SCALE NOTE: run ONE portal instance. The app keeps the working set in memory and
# writes through to the store, so multiple instances would serve stale/conflicting
# state even with a shared Postgres. Multi-instance needs the in-memory cache dropped
# or invalidated first (see portal/store-pg.js and HISTORY.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-portal}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  portal:
    build: .
    environment:
      - PORT=4000
      - NODE_ENV=production
      - UV_THREADPOOL_SIZE=${UV_THREADPOOL_SIZE:-64}
      - WORKERS=${WORKERS:-1}                     # keep at 1 (in-memory cache is not multi-worker safe)
      - PG_POOL=${PG_POOL:-10}
      - PROCTOR_EMAIL_DOMAIN=${PROCTOR_EMAIL_DOMAIN:-vit.ac.in}
      - DATABASE_URL=postgres://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:-portal}@db:5432/${POSTGRES_DB:-portal}
      - VAULT_KEY=${VAULT_KEY:-}                  # empty -> app uses the committed demo key
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - portal
    restart: unless-stopped

volumes:
  pgdata:
